name: BOTW iPhone 15 IPA

on:
  push:
    branches: [no-bc]
  workflow_dispatch:
    inputs:
      game_url:
        description: "Optional fallback: Google Drive/direct download URL for BOTW base game NSP (repository secret is preferred)"
        required: false
        type: string
      update_url:
        description: "Optional fallback: Google Drive/direct download URL for BOTW update NSP (repository secret is preferred)"
        required: false
        type: string
      keys_Url:
        description: "Optional fallback: Google Drive/direct download URL for prod.keys (repository secret is preferred)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: botw-iphone15-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-botw:
    name: Build BOTW 1.9.0 for iPhone 15 (A16)
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      TITLE_ID: "01007EF00011E000"
      PACKAGE_VERSION: "v1114112"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout no-bc branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Xcode and Metal toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -downloadComponent MetalToolchain
          df -h

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang python@3.13
          PY_BASE="$(brew --prefix python@3.13)/bin/python3.13"
          VENV="$RUNNER_TEMP/botw-python-venv"
          "$PY_BASE" -m venv "$VENV"
          PY="$VENV/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic gdown backports.zstd
          echo "PYTHON=$PY" >> "$GITHUB_ENV"

      - name: Download BOTW game, update and keys from Google Drive
        env:
          GAME_URL: ${{ secrets.BOTW_BASE_URL || inputs.game_url }}
          UPDATE_URL: ${{ secrets.BOTW_UPDATE_URL || inputs.update_url }}
          KEYS_URL: ${{ secrets.BOTW_PROD_KEYS_URL || inputs.keys_Url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/botw-input" "$RUNNER_TEMP/botw-output"

          download_file() {
            local url="$1"
            local output="$2"
            case "$url" in
              *drive.google.com*)
                "$PYTHON" -m gdown "$url" -O "$output"
                ;;
              https://*)
                curl --fail --location --retry 5 --retry-delay 3 "$url" -o "$output"
                ;;
              *)
                echo "::error::Only Google Drive or HTTPS download links are supported."
                return 1
                ;;
            esac
            test -s "$output"
            file "$output"
          }

          download_file "$GAME_URL" "$RUNNER_TEMP/botw-input/BOTW-base.nsp"
          download_file "$UPDATE_URL" "$RUNNER_TEMP/botw-input/BOTW-update-1.9.0.nsp"
          download_file "$KEYS_URL" "$RUNNER_TEMP/prod.keys"

          echo "Downloaded input sizes:"
          du -h "$RUNNER_TEMP/botw-input/"* "$RUNNER_TEMP/prod.keys"
          echo "INPUT_DIR=$RUNNER_TEMP/botw-input" >> "$GITHUB_ENV"
          echo "KEYS_FILE=$RUNNER_TEMP/prod.keys" >> "$GITHUB_ENV"

      - name: Validate game packages and prod.keys
        run: |
          set -euo pipefail
          test -s "$INPUT_DIR/BOTW-base.nsp"
          test -s "$INPUT_DIR/BOTW-update-1.9.0.nsp"
          test -s "$KEYS_FILE"
          if ! grep -qiE '^(titlekek|master_key|key_area_key_application)' "$KEYS_FILE"; then
            echo "::warning::prod.keys text check was inconclusive; nx_extract will perform the authoritative key validation."
          fi

      - name: Build BOTW 1.9.0 unsigned IPA (separate RomFS)
        run: |
          set -euo pipefail
          "$PYTHON" scripts/build_ipa_from_nsp.py "$INPUT_DIR" \
            --keys "$KEYS_FILE" \
            --title-id "$TITLE_ID" \
            --package "$PACKAGE_VERSION" \
            --romfs separate \
            --keep-extracted \
            --out "$RUNNER_TEMP/botw-output/BOTW-1.9.0-iPhone15.ipa" \
            --progress lines
          test -s "$RUNNER_TEMP/botw-output/BOTW-1.9.0-iPhone15.ipa"

      - name: Prepare iPhone 15 runtime settings
        run: |
          cat > "$RUNNER_TEMP/botw-output/Documents-env.txt" <<'EOF'
          DM_RENDER_SCALE=0.5
          DM_FPS_TARGET=30
          EOF

      - name: Split separate RomFS for transfer to iPhone
        run: |
          set -euo pipefail
          ROMFS="$(find "$INPUT_DIR/$TITLE_ID"_build -type f -name RomFS.img -print -quit)"
          if [[ -z "$ROMFS" ]]; then
            echo "::error::The build did not produce RomFS.img."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/botw-output/romfs-parts"
          split -b 7000m "$ROMFS" "$RUNNER_TEMP/botw-output/romfs-parts/romfs.part."
          ls -lh "$RUNNER_TEMP/botw-output/romfs-parts"
          echo "RomFS image size: $(stat -f%z "$ROMFS") bytes"

      - name: Upload unsigned IPA and runtime settings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BOTW-1.9.0-iPhone15-IPA
          path: |
            ${{ runner.temp }}/botw-output/BOTW-1.9.0-iPhone15.ipa
            ${{ runner.temp }}/botw-output/Documents-env.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload RomFS part AA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BOTW-RomFS-AA
          path: ${{ runner.temp }}/botw-output/romfs-parts/romfs.part.aa
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload RomFS part AB
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BOTW-RomFS-AB
          path: ${{ runner.temp }}/botw-output/romfs-parts/romfs.part.ab
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

      - name: Upload RomFS part AC
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BOTW-RomFS-AC
          path: ${{ runner.temp }}/botw-output/romfs-parts/romfs.part.ac
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BOTW-build-logs
          path: |
            ${{ runner.temp }}/botw-input/01007EF00011E000_build/logs
            ${{ runner.temp }}/botw-input/01007EF00011E000_build
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
