name: BOTW iPhone 15 IPA

on:
  workflow_dispatch:
    inputs:
      game_dump_url:
        description: "Public HTTPS/Google Drive link to a ZIP of the BOTW Switch dump (base/ and updates/1114112/)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: botw-iphone15-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-botw:
    name: Build BOTW 1.9.0 for iPhone 15 (A16)
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      TITLE_ID: "01007EF00011E000"
      UPDATE_VERSION: "1114112"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout no-bc branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner toolchain and disk
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -downloadComponent MetalToolchain
          df -h

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang python@3.13
          PY="$(brew --prefix python@3.13)/bin/python3.13"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic gdown
          echo "PYTHON=$PY" >> "$GITHUB_ENV"

      - name: Download game dump archive
        env:
          GAME_DUMP_URL: ${{ inputs.game_dump_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/botw-download" "$RUNNER_TEMP/botw-dump"
          cd "$RUNNER_TEMP/botw-download"
          case "$GAME_DUMP_URL" in
            *drive.google.com*)
              "$PYTHON" -m gdown --fuzzy "$GAME_DUMP_URL" -O botw-dump.zip
              ;;
            https://*)
              curl --fail --location --retry 5 --retry-delay 3 "$GAME_DUMP_URL" -o botw-dump.zip
              ;;
            *)
              echo "::error::Provide a public HTTPS or Google Drive share link."
              exit 1
              ;;
          esac
          file botw-dump.zip
          unzip -q botw-dump.zip -d "$RUNNER_TEMP/botw-dump"
          du -sh botw-dump.zip "$RUNNER_TEMP/botw-dump"

      - name: Validate BOTW 1.9.0 dump layout
        run: |
          set -euo pipefail
          MAIN="$(find "$RUNNER_TEMP/botw-dump" -type f -path '*/base/exefs/main' -print -quit)"
          if [[ -z "$MAIN" ]]; then
            echo "::error::Dump ZIP must contain base/exefs/main and base/romfs. This workflow expects an extracted Switch dump, not NxNativeWindow runtime data."
            exit 1
          fi
          DUMP_DIR="${MAIN%/base/exefs/main}"
          test -f "$DUMP_DIR/base/exefs/main.npdm"
          test -d "$DUMP_DIR/base/romfs"
          test -f "$DUMP_DIR/updates/$UPDATE_VERSION/exefs/main"
          test -f "$DUMP_DIR/updates/$UPDATE_VERSION/exefs/main.npdm"
          test -d "$DUMP_DIR/updates/$UPDATE_VERSION/romfs"
          echo "DUMP_DIR=$DUMP_DIR" >> "$GITHUB_ENV"
          echo "Validated dump root: $DUMP_DIR"
          du -sh "$DUMP_DIR"

      - name: Build unsigned IPA (RomFS kept separate)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/botw-output"
          "$PYTHON" scripts/build_ipa_from_nsp.py "$DUMP_DIR" \
            --title-id "$TITLE_ID" \
            --package "v$UPDATE_VERSION" \
            --romfs separate \
            --out "$RUNNER_TEMP/botw-output/BOTW-1.9.0-iPhone15.ipa" \
            --progress lines
          test -s "$RUNNER_TEMP/botw-output/BOTW-1.9.0-iPhone15.ipa"

      - name: Prepare iPhone 15 runtime settings
        run: |
          cat > "$RUNNER_TEMP/botw-output/Documents-env.txt" <<'EOF'
          DM_RENDER_SCALE=0.5
          DM_FPS_TARGET=30
          DM_NO_BC_ASTC=all
          EOF

      - name: Locate and split the separate RomFS image
        run: |
          set -euo pipefail
          ROMFS="$(find "$DUMP_DIR/$TITLE_ID"_build -type f -name RomFS.img -print -quit)"
          if [[ -z "$ROMFS" ]]; then
            echo "::error::Build completed without the expected RomFS.img."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/botw-output/romfs-parts"
          split -b 7500m "$ROMFS" "$RUNNER_TEMP/botw-output/romfs-parts/romfs.part."
          ls -lh "$RUNNER_TEMP/botw-output/romfs-parts"
          echo "ROMFS_BYTES=$(stat -f%z "$ROMFS")" >> "$GITHUB_ENV"

      - name: Upload unsigned IPA and settings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BOTW-1.9.0-iPhone15-IPA
          path: |
            ${{ runner.temp }}/botw-output/BOTW-1.9.0-iPhone15.ipa
            ${{ runner.temp }}/botw-output/Documents-env.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload RomFS part 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BOTW-RomFS-part-1
          path: ${{ runner.temp }}/botw-output/romfs-parts/romfs.part.aa
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

      - name: Upload RomFS part 2
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BOTW-RomFS-part-2
          path: ${{ runner.temp }}/botw-output/romfs-parts/romfs.part.ab
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

      - name: Upload RomFS part 3
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BOTW-RomFS-part-3
          path: ${{ runner.temp }}/botw-output/romfs-parts/romfs.part.ac
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BOTW-build-logs
          path: |
            ${{ runner.temp }}/botw-dump/**/01007EF00011E000_build/logs
            ${{ runner.temp }}/botw-dump/**/01007EF00011E000_build
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
