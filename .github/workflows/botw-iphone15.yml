name: BOTW iPhone 15 IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: botw-iphone15-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-botw:
    name: Build BOTW 1.9.0 for iPhone 15 (A16)
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      TITLE_ID: "01007EF00011E000"
      PACKAGE_VERSION: "v1114112"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout no-bc branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free safe runner caches and report disk space
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h "$RUNNER_TEMP"
          # Remove disposable build/package caches only. Keep Xcode, SDKs,
          # Metal toolchain, downloaded game files and nxnative build outputs.
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
          rm -rf "$HOME/Library/Caches/Homebrew"
          rm -rf "$HOME/.cache/pip"
          brew cleanup -s || true
          echo "Disk space after cleanup:"
          df -h "$RUNNER_TEMP"

      - name: Verify Xcode and Metal toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -downloadComponent MetalToolchain
          df -h

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang python@3.13
          PY_BASE="$(brew --prefix python@3.13)/bin/python3.13"
          VENV="$RUNNER_TEMP/botw-python-venv"
          "$PY_BASE" -m venv "$VENV"
          PY="$VENV/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic gdown backports.zstd
          echo "PYTHON=$PY" >> "$GITHUB_ENV"

      - name: Download BOTW game, update and keys from GitHub Secrets
        env:
          GAME_URL: ${{ secrets.BOTW_BASE_URL }}
          UPDATE_URL: ${{ secrets.BOTW_UPDATE_URL }}
          KEYS_URL: ${{ secrets.BOTW_PROD_KEYS_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/botw-input" "$RUNNER_TEMP/botw-output"

          for name in GAME_URL UPDATE_URL KEYS_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name secret is empty or missing. Configure BOTW_BASE_URL, BOTW_UPDATE_URL and BOTW_PROD_KEYS_URL in repository Actions secrets."
              exit 1
            fi
          done

          download_file() {
            local url="$1"
            local output="$2"
            case "$url" in
              *drive.google.com*)
                "$PYTHON" -m gdown "$url" -O "$output"
                ;;
              https://*)
                curl --fail --location --retry 5 --retry-delay 3 "$url" -o "$output"
                ;;
              *)
                echo "::error::Only Google Drive or HTTPS download links are supported."
                return 1
                ;;
            esac
            test -s "$output"
            file "$output"
          }

          download_file "$GAME_URL" "$RUNNER_TEMP/botw-input/BOTW-base.nsp"
          download_file "$UPDATE_URL" "$RUNNER_TEMP/botw-input/BOTW-update-1.9.0.nsp"
          download_file "$KEYS_URL" "$RUNNER_TEMP/prod.keys"

          echo "Downloaded input sizes:"
          du -h "$RUNNER_TEMP/botw-input/"* "$RUNNER_TEMP/prod.keys"
          echo "INPUT_DIR=$RUNNER_TEMP/botw-input" >> "$GITHUB_ENV"
          echo "KEYS_FILE=$RUNNER_TEMP/prod.keys" >> "$GITHUB_ENV"

      - name: Validate game packages and prod.keys
        run: |
          set -euo pipefail
          test -s "$INPUT_DIR/BOTW-base.nsp"
          test -s "$INPUT_DIR/BOTW-update-1.9.0.nsp"
          test -s "$KEYS_FILE"
          if ! grep -qiE '^(titlekek|master_key|key_area_key_application)' "$KEYS_FILE"; then
            echo "::warning::prod.keys text check was inconclusive; nx_extract will perform the authoritative key validation."
          fi

      - name: Build BOTW 1.9.0 unsigned IPA (RomFS bundled)
        run: |
          set -euo pipefail
          "$PYTHON" scripts/build_ipa_from_nsp.py "$INPUT_DIR" \
            --keys "$KEYS_FILE" \
            --title-id "$TITLE_ID" \
            --package "$PACKAGE_VERSION" \
            --romfs bundle \
            --keep-extracted \
            --out "$RUNNER_TEMP/botw-output/BOTW-1.9.0-iPhone15.ipa" \
            --progress lines
          test -s "$RUNNER_TEMP/botw-output/BOTW-1.9.0-iPhone15.ipa"

      - name: Prepare and verify IPA and RomFS outputs
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/botw-output/Documents-env.txt" <<'EOF'
          DM_RENDER_SCALE=0.5
          DM_FPS_TARGET=30
          EOF

          ROMFS_IMAGE="$INPUT_DIR/${TITLE_ID}_build/extract/${PACKAGE_VERSION}/RomFS.img"
          if [[ ! -s "$ROMFS_IMAGE" ]]; then
            echo "::error::Expected RomFS image was not found: $ROMFS_IMAGE"
            echo "Available extracted image files:"
            find "$INPUT_DIR/${TITLE_ID}_build/extract" -maxdepth 3 -name 'RomFS.img' -type f -print 2>/dev/null || true
            exit 1
          fi
          echo "Verified build outputs:"
          ls -lh "$RUNNER_TEMP/botw-output/BOTW-1.9.0-iPhone15.ipa" "$ROMFS_IMAGE"
          echo "ROMFS_IMAGE=$ROMFS_IMAGE" >> "$GITHUB_ENV"

      - name: Upload unsigned IPA and runtime settings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BOTW-1.9.0-iPhone15-IPA
          path: |
            ${{ runner.temp }}/botw-output/BOTW-1.9.0-iPhone15.ipa
            ${{ runner.temp }}/botw-output/Documents-env.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload RomFS image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BOTW-1.9.0-RomFS-img
          path: ${{ runner.temp }}/botw-input/01007EF00011E000_build/extract/v1114112/RomFS.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BOTW-build-logs
          # Upload only diagnostic logs. The whole build folder contains
          # extracted game data and shader libraries and can be tens of GB.
          path: ${{ runner.temp }}/botw-input/01007EF00011E000_build/logs
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
