name: Zelda Link's Awakening No-BC Full IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-zelda-ipa:
    name: Build Zelda 1.1.0 all-in-one IPA
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GAME: "01006BB00C6F0000"
      BASE_URL: ${{ secrets.ZELDA_BASE_URL }}
      UPDATE_URL: ${{ secrets.ZELDA_UPDATE_URL }}
      KEYS_URL: ${{ secrets.ZELDA_KEYS_URL }}
    steps:
      - name: Checkout selected No-BC fork revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_URL" || { echo "::error::Missing ZELDA_BASE_URL"; exit 1; }
          test -n "$UPDATE_URL" || { echo "::error::Missing ZELDA_UPDATE_URL"; exit 1; }
          test -n "$KEYS_URL" || { echo "::error::Missing ZELDA_KEYS_URL"; exit 1; }
          test "$GITHUB_REF_NAME" = no-bc || { echo "::error::Select the no-bc branch"; exit 1; }
          test -f "dm/games/$GAME/game.tsv"
          grep -q $'package\tv131072' "dm/games/$GAME/game.tsv"

      - name: Install original build dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          command -v xcodegen || brew install xcodegen
          brew list zstd >/dev/null 2>&1 || brew install zstd
          brew list glslang >/dev/null 2>&1 || brew install glslang
          python3 -m venv "$RUNNER_TEMP/zelda-venv"
          "$RUNNER_TEMP/zelda-venv/bin/python" -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic backports.zstd gdown
          echo "$RUNNER_TEMP/zelda-venv/bin" >> "$GITHUB_PATH"

      - name: Download owned NSPs and keys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zelda-input" "$RUNNER_TEMP/zelda-keys"
          chmod 700 "$RUNNER_TEMP/zelda-keys"
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          for env, dest in [
              ("BASE_URL", root / "zelda-input" / "Zelda [01006BB00C6F0000][v0].nsp"),
              ("UPDATE_URL", root / "zelda-input" / "Zelda [01006BB00C6F0800][v131072].nsp"),
              ("KEYS_URL", root / "zelda-keys" / "prod.keys"),
          ]:
              subprocess.run(["gdown", "--output", str(dest), os.environ[env]], check=True)
              if not dest.is_file() or dest.stat().st_size == 0:
                  raise RuntimeError(f"Download failed: {env}")
          (root / "zelda-keys" / "prod.keys").chmod(0o600)
          PY

      - name: Build A16 No-BC IPA with device pipeline cache
        id: build
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/zelda-input" \
            -k "$RUNNER_TEMP/zelda-keys/prod.keys" \
            --package v131072 --gpu none --keep-extracted
          git diff --exit-code

      - name: Upload full IPA (even if verification fails)
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ZeldaLinksAwakening-NoBC-FullIPA
          path: ${{ runner.temp }}/zelda-input/*.ipa
          if-no-files-found: error
          retention-days: 3

      - name: Check 1.1.0 performance patch reference sites (read-only)
        id: diagnose
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zelda-report"
          python3 - <<'PY'
          import hashlib, json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("dm/tools").resolve()))
          import nso, nso_syms
          root = Path(os.environ["RUNNER_TEMP"])
          exefs = root / "zelda-input" / "01006BB00C6F0000_build" / "extract" / "v131072" / "ExeFS"
          expected = {
              "main": "909e904af78ac1b8deefe97ab2ccdb51",
              "subsdk0": "c8a3cc0b1d1858330a881c0c2fc87940",
              "subsdk1": "8df876f80ce4ceee62360b31405c452f",
              "sdk": "3ae34e689d7a35f13cbf42bfd672af8b",
          }
          report = {"title_id": "01006BB00C6F0000", "package": "v131072",
                    "commit": os.environ["GITHUB_SHA"], "modules": {},
                    "status": "metadata only; no binary patch validated"}
          for name, build_id in expected.items():
              p = exefs / name
              if not p.is_file():
                  report["modules"][name] = {"status": "not extracted"}
                  continue
              raw = p.read_bytes()
              try:
                  m = nso.load(raw, name)
                  actual = m.build_id[:16].hex()
                  imports = [s for s, defined, _ in nso_syms.dynsyms(bytes(m.image)) if not defined]
                  report["modules"][name] = {
                      "build_id": actual, "expected_build_id": build_id,
                      "matches": actual == build_id, "sha256": hashlib.sha256(raw).hexdigest(),
                      "file_bytes": len(raw),
                      "candidate_imports": sorted(set(s for s in imports if re.search(
                          r"Vsync|PresentInterval|FrameRate|Tick|Texture|Viewport|WindowCrop|Resolution|Shadow|DepthOfField", s, re.I))),
                  }
              except (ValueError, OSError) as e:
                  report["modules"][name] = {"status": "parse error", "error_type": type(e).__name__}
          report["all_build_ids_match"] = all(v.get("matches", False) for v in report["modules"].values())
          # Reference: LASRecomp (MIT), runtime/game_addresses/patches_v1_0_1.h
          # and tools/patches.py. These are candidate sites, not Nxnative patches.
          # Do not export executable bytes or apply modifications.
          sites = {
              "frame_interval_read": (0xC954, 0xB8696908),
              "dynamic_resolution_enable_read": (0xC938, 0x395922E8),
              "dynamic_resolution_initial_level_read": (0x107CD38, 0xB86D698C),
              "tilt_shift_object_init": (0x10712F0, 0xD10243FF),
          }
          report["reference"] = "https://github.com/peiikai/LASRecomp/blob/main/runtime/game_addresses/patches_v1_0_1.h"
          report["candidate_site_checks"] = {}
          main = exefs / "main"
          if report["modules"].get("main", {}).get("matches") and main.is_file():
              module = nso.load(main.read_bytes(), "main")
              text_start, text_size = module.segments[0]
              for name, (offset, expected_word) in sites.items():
                  in_text = text_start <= offset and offset + 4 <= text_start + text_size
                  matches = in_text and int.from_bytes(
                      module.image[offset:offset + 4], "little") == expected_word
                  report["candidate_site_checks"][name] = {
                      "offset": hex(offset), "in_text": in_text,
                      "matches_reference": matches,
                  }
          report["feature_status"] = {
              "stable_30_fps": "requires game timer and presentation pacing validation",
              "render_scale": "requires render-target and dependent viewport validation",
              "blur_off": "requires tilt-shift parameter lifetime and rendering validation",
              "shadow_1024": "no verified patch site; requires shadow target and sampling validation",
          }
          print("Candidate sites:", report["candidate_site_checks"])

          out = root / "zelda-report" / "game-code-report.json"
          out.write_text(json.dumps(report, indent=2) + "\n")
          print("Module build IDs match:", report["all_build_ids_match"])
          print("Report contains module metadata, imported API names and candidate-site match results only.")
          PY

      - name: Upload game-code diagnostic report
        if: ${{ always() && steps.diagnose.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ZeldaLinksAwakening-A16-CodeReport
          path: ${{ runner.temp }}/zelda-report/game-code-report.json
          if-no-files-found: error
          retention-days: 3

      - name: Verify IPA and game data
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=("$RUNNER_TEMP/zelda-input/"*.ipa)
          test "${#ipas[@]}" -eq 1
          IPA="${ipas[0]}"
          test -s "$IPA"
          python3 - "$IPA" <<'PY'
          import sys, zipfile
          ipa = sys.argv[1]
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
              apps = {name.split("/")[1] for name in names if name.startswith("Payload/") and ".app/" in name}
              game_data = [name for name in names if name.startswith("Payload/") and ("/romfs/" in name or name.endswith("/romfs.img"))]
              if not apps:
                  raise SystemExit("IPA verification failed: no Payload app")
              if not game_data:
                  raise SystemExit("IPA verification failed: no RomFS files or image")
              print(f"IPA verified: {len(names)} entries, {len(game_data)} RomFS entries")
          PY
          ls -lh "$IPA"

