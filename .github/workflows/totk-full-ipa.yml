name: TOTK No-BC Full IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-totk-ipa:
    name: Build TOTK 1.4.3 all-in-one IPA
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GAME: "0100F2C0115B6000"
      BASE_URL: ${{ secrets.TOTK_BASE_URL }}
      UPDATE_URL: ${{ secrets.TOTK_UPDATE_URL }}
      KEYS_URL: ${{ secrets.TOTK_KEYS_URL || secrets.BOTW_KEYS_URL }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout original No-BC fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reclaim unused macOS simulator storage
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          echo "Available disk space before cleanup:"
          df -h "$RUNNER_TEMP"
          # This workflow builds an iPhoneOS IPA, never starts an iOS simulator.
          # Remove simulator runtimes from this disposable GitHub runner only.
          xcrun simctl runtime list -v || true
          xcrun simctl runtime delete all || echo "Simulator runtime removal not available"
          xcrun simctl delete unavailable || true
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData" "$HOME/Library/Developer/CoreSimulator/Caches" || true
          echo "Available disk space after cleanup:"
          df -h "$RUNNER_TEMP"

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_URL" || { echo "::error::Missing TOTK_BASE_URL"; exit 1; }
          test -n "$UPDATE_URL" || { echo "::error::Missing TOTK_UPDATE_URL"; exit 1; }
          test -n "$KEYS_URL" || { echo "::error::Missing TOTK_KEYS_URL (or BOTW_KEYS_URL fallback)"; exit 1; }
          test -n "$GDRIVE_SERVICE_ACCOUNT_JSON" || { echo "::error::Missing GDRIVE_SERVICE_ACCOUNT_JSON"; exit 1; }
          test -f "dm/games/$GAME/game.tsv"
          grep -q $'package\tv720896' "dm/games/$GAME/game.tsv"

      - name: Install original build dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          command -v xcodegen || brew install xcodegen
          brew list zstd >/dev/null 2>&1 || brew install zstd
          brew list glslang >/dev/null 2>&1 || brew install glslang
          python3 -m venv "$RUNNER_TEMP/totk-venv"
          "$RUNNER_TEMP/totk-venv/bin/python" -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic gdown google-auth requests
          echo "$RUNNER_TEMP/totk-venv/bin" >> "$GITHUB_PATH"

      - name: Download owned base XCI, update NSP, and keys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/totk-input" "$RUNNER_TEMP/totk-keys"
          chmod 700 "$RUNNER_TEMP/totk-keys"
          python3 - <<'PY'
          import os, re, subprocess, json, time
          from pathlib import Path
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          root = Path(os.environ["RUNNER_TEMP"])
          credentials_info = json.loads(os.environ["GDRIVE_SERVICE_ACCOUNT_JSON"])
          credentials = service_account.Credentials.from_service_account_info(
              credentials_info, scopes=["https://www.googleapis.com/auth/drive.readonly"]
          )
          def file_id(url):
              match = re.search(r"/file/d/([A-Za-z0-9_-]+)", url)
              if not match:
                  match = re.search(r"[?&]id=([A-Za-z0-9_-]+)", url)
              if not match and re.fullmatch(r"[A-Za-z0-9_-]{20,}", url):
                  return url
              if not match:
                  raise RuntimeError("Expected Google Drive file URL or file ID")
              return match.group(1)

          def download_drive(env, destination):
              fid = file_id(os.environ[env])
              credentials.refresh(Request())
              endpoint = f"https://www.googleapis.com/drive/v3/files/{fid}"
              with requests.get(
                  endpoint,
                  params={"alt": "media", "supportsAllDrives": "true"},
                  headers={"Authorization": f"Bearer {credentials.token}"},
                  stream=True, timeout=(30, 180),
              ) as response:
                  if response.status_code != 200:
                      raise RuntimeError(f"{env}: Google Drive API HTTP {response.status_code}: {response.text[:500]}")
                  with destination.open("wb") as output:
                      for chunk in response.iter_content(chunk_size=8 * 1024 * 1024):
                          if chunk:
                              output.write(chunk)
              if not destination.is_file() or destination.stat().st_size == 0:
                  raise RuntimeError(f"{env}: empty download")
              print(f"{env}: downloaded {destination.stat().st_size:,} bytes")

          download_drive("BASE_URL", root / "totk-input" / "TOTK [0100F2C0115B6000][v0].xci")
          download_drive("UPDATE_URL", root / "totk-input" / "TOTK [0100F2C0115B6800][v720896].nsp")
          key_file = root / "totk-keys" / "prod.keys"
          subprocess.run(["gdown", "--output", str(key_file), os.environ["KEYS_URL"]], check=True)
          if not key_file.is_file() or key_file.stat().st_size == 0:
              raise RuntimeError("KEYS_URL: empty download")
          key_file.chmod(0o600)
          PY

      - name: Build with original No-BC defaults and CI-only disk reclaim
        id: build
        shell: bash
        run: |
          set -euo pipefail
          # The original developer script and game profile remain untouched in git.
          # A throwaway copy only removes downloaded XCI/NSP files after successful extraction
          # and DLC processing, when the build proceeds from the extracted RomFS.
          python3 - <<'PY'
          from pathlib import Path
          original = Path("scripts/build_ipa_from_nsp.py")
          ci_script = Path("scripts/_totk_ci_build_ipa_from_nsp.py")
          script = original.read_text()
          anchor = "    aoc = stage_external_dlc(work, aoc_dir) if aoc_dir is not None else extract_aoc(nx, keys, repo, work, app, fam, logs)\n"
          assert script.count(anchor) == 1, "Build script changed: cannot safely insert disk cleanup"
          extra = """
              if os.environ.get('TOTK_CI_DROP_PACKAGES') == '1':
                  reclaimed = 0
                  for p in sorted(nsp_dir.glob('TOTK *')):
                      if p.is_file() and p.suffix.lower() in ('.xci', '.nsp'):
                          reclaimed += p.stat().st_size
                          p.unlink()
                  say(f'CI-only cleanup after successful XCI/NSP extraction: freed {reclaimed / 2**30:.1f} GiB')
                  remaining = free_gb(work)
                  say(f'CI disk available before shader compilation: {remaining:.1f} GiB')
                  if remaining < 24:
                      raise BuildError(f'not enough space for shaders and full IPA: {remaining:.1f} GiB available after cleanup (need 24 GiB)')
          """
          import textwrap
          # The insertion is at function indentation level (four spaces).
          extra = textwrap.dedent(extra).strip("\n")
          extra = textwrap.indent(extra, "    ") + "\n"
          ci_script.write_text(script.replace(anchor, anchor + extra))
          PY
          TOTK_CI_DROP_PACKAGES=1 python3 scripts/_totk_ci_build_ipa_from_nsp.py "$RUNNER_TEMP/totk-input" \
            -k "$RUNNER_TEMP/totk-keys/prod.keys"

      - name: Upload full IPA (even if verification fails)
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ZeldaTearsOfTheKingdom-NoBC-FullIPA
          path: ${{ runner.temp }}/totk-input/ZeldaTearsOfTheKingdom.ipa
          if-no-files-found: error
          retention-days: 3
          # IPA is already a ZIP archive; do not waste runner time recompressing it.
          compression-level: 0

      - name: Verify IPA and game data
        shell: bash
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/totk-input/ZeldaTearsOfTheKingdom.ipa"
          test -s "$IPA"
          python3 - "$IPA" <<'PY'
          import sys, zipfile
          ipa = sys.argv[1]
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
              apps = {name.split("/")[1] for name in names if name.startswith("Payload/") and ".app/" in name}
              game_data = [name for name in names if name.startswith("Payload/") and ("/romfs/" in name or name.endswith("/romfs.img"))]
              if not apps:
                  raise SystemExit("IPA verification failed: no Payload app")
              if not game_data:
                  raise SystemExit("IPA verification failed: no RomFS files or image")
              print(f"IPA verified: {len(names)} entries, {len(game_data)} RomFS entries")
          PY
          ls -lh "$IPA"

