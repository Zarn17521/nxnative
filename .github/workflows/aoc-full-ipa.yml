name: AOC No-BC Full IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aoc-ipa:
    name: Build AOC 1.4.1 all-in-one IPA
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GAME: "01002B00111A2000"
      BASE_URL: ${{ secrets.AOC_BASE_URL }}
      UPDATE_URL: ${{ secrets.AOC_UPDATE_URL }}
      KEYS_URL: ${{ secrets.AOC_KEYS_URL || secrets.BOTW_KEYS_URL }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout verified No-BC fork
        uses: actions/checkout@v4
        with:
          repository: Zarn17521/nxnative
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Reclaim unused macOS simulator storage
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          echo "Available disk space before cleanup:"
          df -h "$RUNNER_TEMP"
          # This workflow builds an iPhoneOS IPA, never starts an iOS simulator.
          # Remove simulator runtimes from this disposable GitHub runner only.
          xcrun simctl runtime list -v || true
          xcrun simctl runtime delete all || echo "Simulator runtime removal not available"
          xcrun simctl delete unavailable || true
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData" "$HOME/Library/Developer/CoreSimulator/Caches" || true
          echo "Available disk space after cleanup:"
          df -h "$RUNNER_TEMP"

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_URL" || { echo "::error::Missing AOC_BASE_URL"; exit 1; }
          test -n "$UPDATE_URL" || { echo "::error::Missing AOC_UPDATE_URL"; exit 1; }
          test -n "$KEYS_URL" || { echo "::error::Missing AOC_KEYS_URL (or BOTW_KEYS_URL fallback)"; exit 1; }
          test -n "$GDRIVE_SERVICE_ACCOUNT_JSON" || { echo "::error::Missing GDRIVE_SERVICE_ACCOUNT_JSON"; exit 1; }
          test -f "dm/games/$GAME/game.tsv"
          grep -Eq '^package[[:space:]]+v327680' "dm/games/$GAME/game.tsv"
          grep -q 'e87daa5f570f160ba7e99afcba49df5990cf4cfcc30695508b88cf376205ada7' "dm/games/$GAME/patches.py"
          grep -q 'MATCH_FRAME_STEP' scripts/build_ipa_from_nsp.py
          grep -q 'stub_address' dm/tools/patch_nso.py
      - name: Set up compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install original build dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          command -v xcodegen || brew install xcodegen
          brew list zstd >/dev/null 2>&1 || brew install zstd
          brew list glslang >/dev/null 2>&1 || brew install glslang
          python3 --version
          python3 -m venv "$RUNNER_TEMP/aoc-venv"
          "$RUNNER_TEMP/aoc-venv/bin/python" -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic backports.zstd gdown google-auth requests
          echo "$RUNNER_TEMP/aoc-venv/bin" >> "$GITHUB_PATH"

      - name: Download owned base XCI, update NSP, and keys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aoc-input" "$RUNNER_TEMP/aoc-keys"
          chmod 700 "$RUNNER_TEMP/aoc-keys"
          python3 - <<'PY'
          import os, re, subprocess, json, time
          from pathlib import Path
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          root = Path(os.environ["RUNNER_TEMP"])
          credentials_info = json.loads(os.environ["GDRIVE_SERVICE_ACCOUNT_JSON"])
          credentials = service_account.Credentials.from_service_account_info(
              credentials_info, scopes=["https://www.googleapis.com/auth/drive.readonly"]
          )
          def file_id(url):
              match = re.search(r"/file/d/([A-Za-z0-9_-]+)", url)
              if not match:
                  match = re.search(r"[?&]id=([A-Za-z0-9_-]+)", url)
              if not match and re.fullmatch(r"[A-Za-z0-9_-]{20,}", url):
                  return url
              if not match:
                  raise RuntimeError("Expected Google Drive file URL or file ID")
              return match.group(1)

          def download_drive(env, destination):
              fid = file_id(os.environ[env])
              credentials.refresh(Request())
              endpoint = f"https://www.googleapis.com/drive/v3/files/{fid}"
              with requests.get(
                  endpoint,
                  params={"alt": "media", "supportsAllDrives": "true"},
                  headers={"Authorization": f"Bearer {credentials.token}"},
                  stream=True, timeout=(30, 180),
              ) as response:
                  if response.status_code != 200:
                      raise RuntimeError(f"{env}: Google Drive API HTTP {response.status_code}: {response.text[:500]}")
                  with destination.open("wb") as output:
                      for chunk in response.iter_content(chunk_size=8 * 1024 * 1024):
                          if chunk:
                              output.write(chunk)
              if not destination.is_file() or destination.stat().st_size == 0:
                  raise RuntimeError(f"{env}: empty download")
              print(f"{env}: downloaded {destination.stat().st_size:,} bytes")

          download_drive("BASE_URL", root / "aoc-input" / "AOC [01002B00111A2000][v0].xci")
          download_drive("UPDATE_URL", root / "aoc-input" / "AOC [01002B00111A2800][v458752].nsp")
          key_file = root / "aoc-keys" / "prod.keys"
          subprocess.run(["gdown", "--output", str(key_file), os.environ["KEYS_URL"]], check=True)
          if not key_file.is_file() or key_file.stat().st_size == 0:
              raise RuntimeError("KEYS_URL: empty download")
          key_file.chmod(0o600)
          PY

      - name: Build with untouched upstream No-BC defaults
        id: build
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/aoc-input" \
            -k "$RUNNER_TEMP/aoc-keys/prod.keys" --package v458752
          git diff --exit-code

      - name: Upload full IPA (even if verification fails)
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: HyruleWarriorsAOC-NoBC-FullIPA
          path: ${{ runner.temp }}/aoc-input/*.ipa
          if-no-files-found: error
          retention-days: 3
          # IPA is already a ZIP archive; do not waste runner time recompressing it.
          compression-level: 0

      - name: Verify IPA and game data
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=("$RUNNER_TEMP/aoc-input/"*.ipa)
          test "${#ipas[@]}" -eq 1
          IPA="${ipas[0]}"
          test -s "$IPA"
          python3 - "$IPA" <<'PY'
          import sys, zipfile
          ipa = sys.argv[1]
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
              apps = {name.split("/")[1] for name in names if name.startswith("Payload/") and ".app/" in name}
              game_data = [name for name in names if name.startswith("Payload/") and ("/romfs/" in name or name.endswith("/romfs.img"))]
              if not apps:
                  raise SystemExit("IPA verification failed: no Payload app")
              if not game_data:
                  raise SystemExit("IPA verification failed: no RomFS files or image")
              print(f"IPA verified: {len(names)} entries, {len(game_data)} RomFS entries")
          PY
          ls -lh "$IPA"
