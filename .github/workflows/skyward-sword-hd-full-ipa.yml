name: Skyward Sword HD No-BC 2x IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sshd-ipa:
    name: Build Skyward Sword HD 1.0.1 (1x / 2x)
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GAME: "01002DA013484000"
      BASE_URL: ${{ secrets.SSHD_BASE_URL }}
      UPDATE_URL: ${{ secrets.SSHD_UPDATE_URL }}
      KEYS_URL: ${{ secrets.SSHD_KEYS_URL || secrets.BOTW_KEYS_URL }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout verified No-BC fork
        uses: actions/checkout@v4
        with:
          repository: Zarn17521/nxnative
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Check available build storage
        shell: bash
        run: df -h "$RUNNER_TEMP"

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_URL" || { echo "::error::Missing SSHD_BASE_URL"; exit 1; }
          test -n "$UPDATE_URL" || { echo "::error::Missing SSHD_UPDATE_URL"; exit 1; }
          test -n "$KEYS_URL" || { echo "::error::Missing SSHD_KEYS_URL (or BOTW_KEYS_URL fallback)"; exit 1; }
          test "$GITHUB_REF_NAME" = no-bc || { echo "::error::Select the no-bc branch"; exit 1; }
          test -f "dm/games/$GAME/game.tsv"
          grep -q '5441af3c89f97e1d25a8ccf14c742bf8' "dm/games/$GAME/game.tsv"
          grep -q 'SKYWARD_RES' dm/tools/patch_nso.py
          grep -q 'skyward_resolution_apply' dm/host/loader.c
          grep -Eq '^package[[:space:]]+v65536' "dm/games/$GAME/game.tsv"
      - name: Set up compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install original build dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          command -v xcodegen || brew install xcodegen
          brew list zstd >/dev/null 2>&1 || brew install zstd
          brew list glslang >/dev/null 2>&1 || brew install glslang
          python3 --version
          python3 -m venv "$RUNNER_TEMP/sshd-venv"
          "$RUNNER_TEMP/sshd-venv/bin/python" -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic backports.zstd gdown google-auth requests
          echo "$RUNNER_TEMP/sshd-venv/bin" >> "$GITHUB_PATH"

      - name: Download owned base NSP, update NSP, and keys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sshd-input" "$RUNNER_TEMP/sshd-keys"
          chmod 700 "$RUNNER_TEMP/sshd-keys"
          python3 - <<'PY'
          import os, re, subprocess, json, time
          from pathlib import Path
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          root = Path(os.environ["RUNNER_TEMP"])
          credentials = None
          if os.environ.get("GDRIVE_SERVICE_ACCOUNT_JSON"):
              credentials = service_account.Credentials.from_service_account_info(
                  json.loads(os.environ["GDRIVE_SERVICE_ACCOUNT_JSON"]),
                  scopes=["https://www.googleapis.com/auth/drive.readonly"]
              )
          def file_id(url):
              match = re.search(r"/file/d/([A-Za-z0-9_-]+)", url)
              if not match:
                  match = re.search(r"[?&]id=([A-Za-z0-9_-]+)", url)
              if not match and re.fullmatch(r"[A-Za-z0-9_-]{20,}", url):
                  return url
              if not match:
                  raise RuntimeError("Expected Google Drive file URL or file ID")
              return match.group(1)

          def download_drive(env, destination):
              if credentials is None:
                  subprocess.run(["gdown", "--output", str(destination), os.environ[env]], check=True)
                  if not destination.is_file() or destination.stat().st_size == 0:
                      raise RuntimeError(f"{env}: empty download")
                  return
              fid = file_id(os.environ[env])
              credentials.refresh(Request())
              endpoint = f"https://www.googleapis.com/drive/v3/files/{fid}"
              with requests.get(
                  endpoint,
                  params={"alt": "media", "supportsAllDrives": "true"},
                  headers={"Authorization": f"Bearer {credentials.token}"},
                  stream=True, timeout=(30, 180),
              ) as response:
                  if response.status_code != 200:
                      raise RuntimeError(f"{env}: Google Drive API HTTP {response.status_code}")
                  with destination.open("wb") as output:
                      for chunk in response.iter_content(chunk_size=8 * 1024 * 1024):
                          if chunk:
                              output.write(chunk)
              if not destination.is_file() or destination.stat().st_size == 0:
                  raise RuntimeError(f"{env}: empty download")
              print(f"{env}: downloaded {destination.stat().st_size:,} bytes")

          # Check the small private keys file first, using the same authenticated
          # Drive downloader as the game files. Fail before large downloads if
          # the service account cannot access it.
          key_file = root / "sshd-keys" / "prod.keys"
          download_drive("KEYS_URL", key_file)
          key_file.chmod(0o600)
          download_drive("BASE_URL", root / "sshd-input" / "SSHD [01002DA013484000][v0].nsp")
          download_drive("UPDATE_URL", root / "sshd-input" / "SSHD [01002DA013484800][v65536].nsp")
          PY

      - name: Build No-BC with guarded 2x support
        id: build
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/sshd-input" \
            -k "$RUNNER_TEMP/sshd-keys/prod.keys" --package v65536 --gpu none --no-keep-extracted
          git diff --exit-code

      - name: Upload full IPA (even if verification fails)
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: SkywardSwordHD-NoBC-2x-FullIPA
          path: ${{ runner.temp }}/sshd-input/*.ipa
          if-no-files-found: error
          retention-days: 3
          # IPA is already a ZIP archive; do not waste runner time recompressing it.
          compression-level: 0

      - name: Verify IPA and game data
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=("$RUNNER_TEMP/sshd-input/"*.ipa)
          test "${#ipas[@]}" -eq 1
          IPA="${ipas[0]}"
          test -s "$IPA"
          python3 - "$IPA" <<'PY'
          import json, sys, zipfile
          ipa = sys.argv[1]
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
              apps = {name.split("/")[1] for name in names if name.startswith("Payload/") and ".app/" in name}
              game_data = [name for name in names if name.startswith("Payload/") and ("/romfs/" in name or name.endswith("/romfs.img"))]
              if not apps:
                  raise SystemExit("IPA verification failed: no Payload app")
              if not game_data:
                  raise SystemExit("IPA verification failed: no RomFS files or image")
              settings = [n for n in names if n.startswith("Payload/") and n.endswith("/dm/launcher.json")]
              if not settings:
                  raise SystemExit("IPA verification failed: launcher.json missing")
              def scales(obj):
                  if isinstance(obj, dict):
                      if obj.get("env") == "DM_RENDER_SCALE":
                          yield obj
                      for v in obj.values():
                          yield from scales(v)
                  elif isinstance(obj, list):
                      for v in obj:
                          yield from scales(v)
              rows = [row for path in settings for row in scales(json.loads(archive.read(path)))]
              if not any(row.get("min") == 1 and row.get("max") == 2 for row in rows):
                  raise SystemExit("2x not verified: resolution table did not expose the 1x/2x launcher control")
              print("2x launcher support verified; device test still required")
              print(f"IPA verified: {len(names)} entries, {len(game_data)} RomFS entries")
          PY
          ls -lh "$IPA"
